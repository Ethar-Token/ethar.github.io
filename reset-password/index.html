<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ETHAR - Reset Password</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0b1220;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
background:#151e2f;
padding:35px;
border-radius:15px;
width:100%;
max-width:450px;
color:white;
}

h2{
color:#f4b400;
margin-bottom:10px;
}

p{
color:#bfc5d2;
margin-bottom:25px;
line-height:1.6;
}

label{
display:block;
margin-bottom:8px;
margin-top:15px;
font-weight:600;
}

input{
width:100%;
padding:14px;
border:1px solid #2d3b57;
border-radius:10px;
background:#0b1220;
color:white;
}

button{
width:100%;
margin-top:25px;
padding:14px;
background:#f4b400;
border:none;
border-radius:10px;
font-weight:700;
font-size:15px;
cursor:pointer;
}

.notice{
margin-top:20px;
background:#0b1220;
border-left:4px solid #f4b400;
padding:15px;
border-radius:8px;
line-height:1.8;
font-size:14px;
}

a{
color:#f4b400;
text-decoration:none;
}

.etharToast{

position:fixed;

left:50%;
bottom:30px;

transform:translateX(-50%) translateY(80px);

background:#151e2f;

border:2px solid #f4b400;

color:white;

padding:15px 22px;

border-radius:14px;

display:flex;

align-items:center;

gap:12px;

font-weight:600;

box-shadow:0 12px 35px rgba(0,0,0,.45);

opacity:0;

transition:.3s;

z-index:999999;

}

.etharToast.show{

opacity:1;

transform:translateX(-50%) translateY(0);

}

.toastIcon{

font-size:20px;

color:#f4b400;

}

.toastText{

white-space:nowrap;

}

@media(max-width:768px){

.etharToast{

width:90%;

justify-content:center;

font-size:15px;

}

}

</style>

</head>

<body>

<div class="card">

<h2>Reset Password</h2>

<p>Create a new password for your ETHAR account.</p>

<label>New Password</label>

<input
type="password"
id="newPassword"
placeholder="Enter new password">

<label>Confirm Password</label>

<input
type="password"
id="confirmPassword"
placeholder="Confirm new password">

<button id="resetBtn">

UPDATE PASSWORD

</button>

<div class="notice">

<strong>Password Requirements</strong>

<br><br>

✔ At least 8 characters<br>
✔ One uppercase letter<br>
✔ One lowercase letter<br>
✔ One number<br>
✔ One special character

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../toast.js"></script>

<script>

const supabaseUrl = "https://ynohexdhktetiepmbwnx.supabase.co";

const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlub2hleGRoa3RldGllcG1id254Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3MDU5ODcsImV4cCI6MjA5OTI4MTk4N30.bOgCv0UJxYvNSXDxCFs9_6lWfm-h5RipjLzqFIC7Miw";

const client = supabase.createClient(
    supabaseUrl,
    supabaseKey
);

document
.getElementById("resetBtn")
.addEventListener("click", resetPassword);

async function resetPassword(){

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if(!newPassword || !confirmPassword){

        showToast("Please complete all fields.", "error");
        return;

    }

    if(newPassword !== confirmPassword){

        showToast("Passwords do not match.", "error");
        return;

    }

    const passwordRegex =
        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_\-+=\[\]{};:'",.<>/?\\|`~]).{8,}$/;

    if(!passwordRegex.test(newPassword)){

        showToast(`Password Requirements

✔ At least 8 characters
✔ One uppercase letter
✔ One lowercase letter
✔ One number
✔ One special character`, "error");

        return;

    }

    const { error } =
        await client.auth.updateUser({

            password:newPassword

        });

    if(error){

        showToast(error.message, "error");
        return;

    }

    showToast("Password updated successfully.");

    window.location.href="/login";

}

</script>

</body>
</html>
